<!DOCTYPE html>
<title>jogos de plataforma</title>
<html lang="pt-BR">
    <style>
        body{
            background: linear-gradient(black,aqua);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
        }

        .painel{
            background-color: black;
            color: aqua;
            padding: 60px;
            width: 600px;
            border-radius: 30px;
            box-shadow: 10px 20px 30px aqua;
            text-shadow: 0 0 15px aqua;
            animation: surgir 1s ease-out forwards, pulsarBrilho 4s infinite ease-in-out;
        }

        .botao{
            background-color: aqua;
            color: black;
            padding: 12px;
            width: 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px aqua;
            text-decoration: none;
        }

        .logo{
            background-color: black;
            color: aqua;
            padding: 30px;
            width: 300px;
            border-radius: 30px;
            box-shadow: 10px 20px 30px aqua;
            text-shadow: 0 0 15px aqua;
            margin-left: 320px;
            animation: surgir 1s ease-out forwards, pulsarBrilho 4s infinite ease-in-out;
        }

        @keyframes surgir {
    from {
        opacity: 0;
        transform: translateY(50px); 
    }
    to {
        opacity: 1;
        transform: translateY(0);    
    }
}


@keyframes pulsarBrilho {
    0% {
        box-shadow: 10px 20px 20px aquamarine;
    }
    50% {
        box-shadow: 10px 20px 40px aqua; /* Brilha mais */
    }
    100% {
        box-shadow: 10px 20px 20px aquamarine;
    }
}
    </style>
