<!DOCTYPE html>
<title>jogos de historia</title>
<html lang="pt-BR">
    <style>
        body{
            background: linear-gradient(black,aqua);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            
        }
        .painel{
            background-color: black;
            color: aqua;
            padding: 60px;
            width: 600px;
            border-radius: 30px;
            box-shadow: 10px 20px 30px aqua;
            text-shadow: 0 0 15px aqua;
            animation: surgir 1s ease-out forwards, pulsarBrilho 4s infinite ease-in-out;
        }

        .botao{
            background-color: aqua;
            color: black;
            padding: 12px;
            width: 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px aqua;
            text-decoration: none;
        }

        .logo{
            background-color: black;
            color: aqua;
            border-radius: 30px;
            padding: 30px;
            width: 300px;
            box-shadow: 10px 20px 30px aqua;
            text-shadow: 0 0 15px aqua;
            margin-left: 320px;
            animation: surgir 1s ease-out forwards, pulsarBrilho 4s infinite ease-in-out;
        }

        @keyframes surgir {
    from {
        opacity: 0;
        transform: translateY(50px); 
    }
    to {
        opacity: 1;
        transform: translateY(0);    
    }
}


@keyframes pulsarBrilho {
    0% {
        box-shadow: 10px 20px 20px aquamarine;
    }
    50% {
        box-shadow: 10px 20px 40px aqua; /* Brilha mais */
    }
    100% {
        box-shadow: 10px 20px 20px aquamarine;
    }
}
        
    </style>
    <body>
        <div class="painel">
            <a href="index.html"class="botao">home</a>
            <h1>jogos de historia</h1>
            <h1>smokingGun</h1>
            <a href="https://drive.google.com/file/d/1XHAYmhJ0-Vc-GAYMNS6solNHsGDY_Shf/view?usp=sharing"class="botao">abaixar</a>
            <h1>dragon ball z pixel art</h1>
            <a href="https://drive.google.com/file/d/15lZRqUSjvr9RJ6IRkK4QXs8JtpIjKyrR/view?usp=sharing"class="botao">abaixar</a>


        </div>
    </body>
    <div class="logo">
        <h1>rafagames</h1>
    </div>
</html>
